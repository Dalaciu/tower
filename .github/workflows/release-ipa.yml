name: Release unsigned IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.0.4-unsigned.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version

      - name: Build unsigned .app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Tower.xcodeproj -scheme Tower \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build/build.log

      - name: Wrap into IPA
        run: |
          APP="$(ls -d build/Build/Products/Release-iphoneos/Tower.app | head -1)"
          [ -d "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tower-unsigned.ipa Payload
          ls -lh Tower-unsigned.ipa

      - name: Record version
        id: ver
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/Tower.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/Tower.app/Info.plist)
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Tower.app/Info.plist)
          SIZE=$(stat -f%z Tower-unsigned.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BID" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: Tower-unsigned.ipa
          body: |
            Unsigned IPA for AltStore sideloading.

            - version: ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})
            - bundle id: ${{ steps.ver.outputs.bundle_id }}
            - size: ${{ steps.ver.outputs.size }} bytes
            - built: ${{ steps.ver.outputs.date }}

      - name: Refresh source.json on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${{ steps.ver.outputs.version }}"
          SIZE="${{ steps.ver.outputs.size }}"
          DATE="${{ steps.ver.outputs.date }}"
          BID="${{ steps.ver.outputs.bundle_id }}"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Tower-unsigned.ipa"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          python3 - <<PY
          import json, pathlib
          p = pathlib.Path("source.json")
          d = json.loads(p.read_text())
          app = d["apps"][0]
          entry = {
              "version": "$VER",
              "date": "$DATE",
              "localizedDescription": "AltStore release of Tower.",
              "downloadURL": "$DL",
              "size": int("$SIZE"),
          }
          app["version"] = "$VER"
          app["versionDate"] = "$DATE"
          app["versionDescription"] = "AltStore release of Tower."
          app["downloadURL"] = "$DL"
          app["size"] = int("$SIZE")
          app.setdefault("versions", [])
          app["versions"] = [entry] + [v for v in app["versions"] if v.get("version") != "$VER"]
          p.write_text(json.dumps(d, indent=2))
          PY

          git add source.json
          if git diff --cached --quiet; then
            echo "source.json unchanged"; exit 0
          fi
          git commit -m "source.json: publish $TAG"
          git push origin main
