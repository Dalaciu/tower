name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_tag:
        description: "Existing release tag to rebuild the IPA for (e.g. v2.1.0). Leave empty to let release-please decide."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-ipa:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.rebuild_tag != ''
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.rebuild_tag }}
    steps:
      # Order matters: the tag checkout runs `git clean -ffdx` at the
      # workspace root, which would wipe a prior sibling checkout.
      # Check out the tag source first (workspace root), then the CI
      # action into a nested path whose own `git clean` is scoped to
      # that subdir, so the tag source stays intact.
      - name: Checkout tag source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - name: Checkout CI action from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          path: __ci__

      - name: Build + attest + publish
        uses: ./__ci__/.github/actions/build-altstore-ipa
        with:
          tag: ${{ env.TAG }}
          version: ${{ needs.release-please.outputs.version }}
