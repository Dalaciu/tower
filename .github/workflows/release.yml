name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-ipa:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version

      - name: Sync MARKETING_VERSION to tag
        run: |
          sed -i '' -E "s/MARKETING_VERSION = [0-9A-Za-z.\-]+;/MARKETING_VERSION = ${VERSION};/g" Tower.xcodeproj/project.pbxproj
          grep -o 'MARKETING_VERSION = [^;]*;' Tower.xcodeproj/project.pbxproj | sort -u

      - name: Build unsigned .app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Tower.xcodeproj -scheme Tower \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build/build.log

      - name: Wrap into IPA
        run: |
          APP="$(ls -d build/Build/Products/Release-iphoneos/Tower.app | head -1)"
          [ -d "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tower-unsigned.ipa Payload
          ls -lh Tower-unsigned.ipa

      - name: Attach IPA to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Tower-unsigned.ipa --clobber

      - name: Patch source.json metadata on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -f%z Tower-unsigned.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          jq --arg size "$SIZE" --arg date "$DATE" --arg ver "$VERSION" \
             '.apps[0].size = ($size|tonumber)
              | .apps[0].versionDate = $date
              | .apps[0].versions = ([{
                  version: $ver,
                  date: $date,
                  localizedDescription: ("AltStore release " + $ver + "."),
                  downloadURL: .apps[0].downloadURL,
                  size: ($size|tonumber)
                }] + (.apps[0].versions // [] | map(select(.version != $ver))))' \
             source.json > source.json.new
          mv source.json.new source.json
          git add source.json
          if git diff --cached --quiet; then
            echo "source.json unchanged"; exit 0
          fi
          git commit -m "chore(source): sync $TAG metadata [skip ci]"
          git push origin main
